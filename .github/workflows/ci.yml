# Unit and browser tests on every push and pull request; on a version tag (v*), Debian packages for every
# distro and architecture, attached to that tag's GitHub release. See docs/packaging.md.
name: CI

on:
  push:
    branches: [ros2]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # build packages for one distro/arch as run artifacts, without a release
    inputs:
      distro:
        description: ROS distro
        type: choice
        options: [jazzy, humble, lyrical]
        default: jazzy
      arch:
        description: Architecture
        type: choice
        options: [amd64, arm64]
        default: amd64

permissions:
  contents: write # attach packages to the release on tags

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests
        working-directory: vizanti_server
        run: node --test "test/js/*.test.mjs"
      - name: Nav2 plugin unit tests
        run: node --test "vizanti_nav2/test/*.test.mjs"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Server unit tests
        working-directory: vizanti_server
        run: pip install pytest && python -m pytest -q test/python

  browser:
    # the web UI driven by Playwright against a Vizanti built and run in a ROS container
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Start Vizanti (Jazzy, in Docker)
        run: vizanti_server/test/e2e/run_server_docker.sh jazzy 5080 5081
      - name: Install Playwright
        working-directory: vizanti_server/test/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: vizanti_server/test/e2e
        env:
          VIZANTI_URL: http://localhost:5080
        run: npx playwright test
      - name: Server log
        if: failure()
        run: docker logs --tail 200 vizanti-e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            vizanti_server/test/e2e/playwright-report
            vizanti_server/test/e2e/test-results

  debs:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [tests, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 300 # arm64 builds run under QEMU emulation
    strategy:
      fail-fast: false
      matrix:
        # every combination on a tag; the chosen one when run by hand
        distro: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.distro) || '["humble", "jazzy", "lyrical"]') }}
        arch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.arch) || '["amd64", "arm64"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: QEMU for arm64
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Build packages
        run: packaging/build_debs_docker.sh ${{ matrix.distro }} --arch ${{ matrix.arch }} --out out
      - uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.distro }}-${{ matrix.arch }}
          path: out/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: debs
          merge-multiple: true
      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l debs
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" debs/*.deb --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" debs/*.deb --repo "$GITHUB_REPOSITORY" --title "Vizanti $TAG" --generate-notes
          fi
