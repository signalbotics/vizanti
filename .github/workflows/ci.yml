# Unit tests on every push and pull request; on a version tag (v*), Debian packages for every
# distro and architecture, attached to that tag's GitHub release. See docs/packaging.md.
name: CI

on:
  push:
    branches: [ros2]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # attach packages to the release on tags

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        working-directory: vizanti_server
        run: node --test "test/js/*.test.mjs"

  debs:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 300 # arm64 builds run under QEMU emulation
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy, lyrical]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: QEMU for arm64
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build packages
        run: packaging/build_debs_docker.sh ${{ matrix.distro }} --arch ${{ matrix.arch }} --out out
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.distro }}-${{ matrix.arch }}
          path: out/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: debs
          merge-multiple: true
      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l debs
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" debs/*.deb --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" debs/*.deb --repo "$GITHUB_REPOSITORY" --title "Vizanti $TAG" --generate-notes
          fi
